VIEWS.about = {
  render(el) {
    const item = (ic, k) => `<li><span class="ab-ic">${icon(ic)}</span><div><b>${t(k + '_t')}</b><p>${t(k + '_d')}</p></div></li>`;
    el.innerHTML = `
    <div class="page about">
      <section class="ab-hero">
        <img class="ab-logo" src="${LOGO.full}" alt="${esc(APP_NAME[0] + ' ' + APP_NAME[1])}" width="280" height="280">
        <div class="ab-hero-txt">
          <p class="eyebrow">${t('about_eyebrow')}</p>
          <h1>${t('about_hero_h')}</h1>
          <p class="lede">${t('about_hero_p')}</p>
          <div class="hero-cta"><a class="btn btn-primary" href="#scan">${icon('scan')}${t('cta_scan')}</a><a class="btn btn-line" href="#help">${icon('chat')}${t('nav_help')}</a></div>
        </div>
      </section>
      <section class="card ab-sec"><h2 class="h3">${t('about_name_h')}</h2>
        <ol class="ab-name">${['1', '2', '3'].map(n => `<li><span class="ab-word">${t('about_name_' + n + '_t')}</span><p>${t('about_name_' + n + '_d')}</p></li>`).join('')}</ol>
      </section>
      <section class="card ab-sec ab-logo-sec"><h2 class="h3">${t('about_logo_h')}</h2>
        <div class="ab-logo-grid"><img class="ab-mark" src="${LOGO.mark}" alt="" width="128" height="128">
          <ul class="ab-list">${item('fish', 'about_logo_1')}${item('sparkle', 'about_logo_2')}${item('contrast', 'about_logo_3')}</ul></div>
      </section>
      <section class="card ab-sec"><h2 class="h3">${t('about_for_h')}</h2>
        <ul class="ab-list ab-for">${item('log', 'about_for_1')}${item('shield', 'about_for_2')}${item('warn', 'about_for_3')}${item('sea', 'about_for_4')}${item('users', 'about_for_5')}</ul>
      </section>
      <p class="ab-close">${t('about_close')}</p>
      <p class="hint ab-made">${t('about_made')}</p>
    </div>`;
  }
};

/* ---------- HELP ---------- */
VIEWS.help = {
  render(el) {
    const mine = S.mySuggest.slice().reverse().slice(0, 5);
    el.innerHTML = `
    <div class="page help">
      <header class="page-head"><h1>${t('help_title')}</h1><p class="lede">${t('help_sub')}</p></header>
      <div class="help-grid">
        <section class="card kakao">
          <p class="eyebrow">${t('kakao_eyebrow')}</p>
          <h2>${t('kakao_title')}</h2>
          <div class="kakao-body">
            <div class="qr" role="img" aria-label="${esc(t('qr_aria'))}"><svg viewBox="-2 -2 37 37" shape-rendering="crispEdges"><rect x="-2" y="-2" width="37" height="37" fill="#fff"/><path d="${QR_PATH}" fill="#111"/></svg></div>
            <div class="kakao-info">
              <dl class="kv"><div><dt>${t('dev')}</dt><dd>${esc(DEV.name)}</dd></div><div data-copybox><dt>${t('kakao_id')}</dt><dd><span class="copy-src mono">${DEV.kakaoId}</span> <button class="btn btn-ghost btn-xs" data-copy="${DEV.kakaoId}">${icon('copy')}${t('copy')}</button></dd></div></dl>
              <a class="btn btn-kakao btn-lg btn-block" href="${DEV.kakaoUrl}" target="_blank" rel="noopener">${icon('chat')}${t('kakao_ask')}</a>
              <p class="hint">${t('kakao_hint')}</p>
            </div>
          </div>
        </section>
        <section class="card suggest">
          <p class="eyebrow">${t('sg_eyebrow')}</p>
          <h2>${t('sg_title')}</h2>
          <form id="sg-form" novalidate>
            <div class="chip-row" role="radiogroup" aria-label="${esc(t('sg_cat'))}">${['feature', 'bug', 'species', 'pay', 'etc'].map((c, i) => `<label class="chip chip-tab"><input type="radio" name="sg-cat" value="${c}" ${i === 0 ? 'checked' : ''}><span>${t('sgc_' + c)}</span></label>`).join('')}</div>
            <div class="field"><label for="sg-text" class="sr">${t('sg_title')}</label><textarea id="sg-text" rows="5" maxlength="1000" placeholder="${esc(t('sg_ph'))}"></textarea></div>
            <div class="actions"><button class="btn btn-primary" type="submit">${icon('send')}${t('sg_save')}</button><button class="btn btn-kakao" type="button" id="sg-kakao">${icon('chat')}${t('sg_kakao')}</button></div>
            <p class="hint">${t('sg_hint')}</p>
          </form>
          ${mine.length ? `<h3 class="h4">${t('sg_mine')}</h3><ul class="sg-list">${mine.map(s => `<li><span class="chip">${t('sgc_' + s.cat)}</span><span>${esc(s.text.slice(0, 80))}</span><span class="muted small">${ago(s.ts)}</span></li>`).join('')}</ul>` : ''}
        </section>
      </div>
      <section class="card donate-card">
        <div class="dc-txt"><p class="eyebrow">${t('donate_eyebrow')}</p><h2>${t('donate_title')}</h2><p>${t('donate_desc')}</p></div>
        <button class="btn btn-heart btn-lg" data-act="donate">${icon('heart')}${t('donate_btn')}</button>
      </section>
      <section class="faq">
        <h2 class="h3">${t('faq_title')}</h2>
        ${['scan', 'train', 'score', 'past', 'fake', 'review', 'friends', ...(window.APP_RT === 'web' ? ['account'] : []), 'pay', 'spot', 'legal', 'beta'].map(k => `<details class="card"><summary>${t('faq_' + k + '_q')}</summary><p>${t('faq_' + k + '_a', { p: fmtN(PREMIUM_PRICE) })}</p></details>`).join('')}
      </section>
    </div>`;
    const compose = () => { const cat = ($('input[name="sg-cat"]:checked', el) || {}).value || 'feature'; const text = $('#sg-text', el).value.trim(); return { cat, text, msg: `[${APP_NAME[0]} ${APP_NAME[1]} · ${t('sgc_' + cat)}]\n${text}\n— ${S.me?.nick || ''} ${S.me?.cc ? '(' + S.me.cc + ')' : ''}` }; };
    $('#sg-form', el).onsubmit = async e => {
      e.preventDefault(); const c = compose(); if (c.text.length < 2) { toast(t('sg_empty'), 'warn'); return; }
      const ok = await store.addSuggestion({ id: rid(8), cat: c.cat, text: c.text, ts: nowMs(), nick: S.me?.nick || '' });
      toast(t(ok ? 'sg_saved' : 'sg_saved_local')); $('#sg-text', el).value = ''; this.render(el);
    };
    $('#sg-kakao', el).onclick = async () => {
      const c = compose(); if (c.text.length < 2) { toast(t('sg_empty'), 'warn'); return; }

/* ===== Today's fishing buzz: community highlights ("ZZIRIT flash") + daily world headlines ===== */
let _hlCache = { v: -1 };
function zzHighlights(limit = 12) {
  if (_hlCache.v === S.dataVer && _hlCache.limit === limit) return _hlCache.list;
  const now = nowMs(), wk = now - 7 * 864e5, day = now - 864e5;
  const firsts = new Map(); const pool = [];
  for (const [uid, a] of allAnglers()) {
    if (!a || a._local || !a.nick) continue;
    for (const c of a.catches || []) {
      if (!SPI[c.sp] || !c.len || !eligible(c, uid)) continue;
      const at = c.at || c.ts || 0;
      const f = firsts.get(c.sp); if (!f || at < f.at) firsts.set(c.sp, { c, at });
      if (at >= wk) pool.push({ uid, a, c, at });
    }
  }
  const stories = [];
  for (const h of pool) {
    const sp = SPI[h.c.sp]; const rel = h.c.len / sp.L, rec = h.c.len / sp.X;
    const cands = [{ k: 'big', score: 40 + rel * 20 + (h.at > day ? 8 : 0) }];
    if (rec >= .8) cands.push({ k: 'record', score: 92 + rec * 10, pct: Math.round(rec * 100) });
    if (sp.r >= 5) cands.push({ k: 'rare', score: 86 });
    const f = firsts.get(h.c.sp); if (f && f.c === h.c) cands.push({ k: 'first', score: 90 });
    if (h.c.rel && rel >= 1.05) cands.push({ k: 'release', score: 58 + rel * 5 });
    const best = cands.sort((x, y) => y.score - x.score)[0];
    stories.push(Object.assign({}, h, best, { rel }));
  }
  const bigs = stories.filter(s => s.k === 'big').sort((x, y) => y.rel - x.rel);
  if (bigs[0]) { bigs[0].k = 'top'; bigs[0].score += 30; }
  let list = stories.filter(s => s.k !== 'big' || bigs.indexOf(s) < 4);
  const lead = teamIndex().ranked[0];
  if (lead && lead.pts > 0) list.push({ k: 'team', score: 62, at: now, team: lead });
  list = list.sort((x, y) => y.score - x.score || y.at - x.at).slice(0, limit);
  _hlCache = { v: S.dataVer, limit, list };
  return list;
}

  const nm = tgt.closest('[data-news="more"]'); if (nm) { openNews(); return; }
  const idb = tgt.closest('[data-id]'); if (idb) { const k = idb.dataset.id; if (k === 'create') openIdCreate(); else if (k === 'login') openIdLogin(); else if (k === 'password') openIdPassword(); else if (k === 'logout') idLogout(idb); return; }
  const du = tgt.closest('[data-deluser]'); if (du) { adminDeleteUser(du.dataset.deluser, du); return; }
  const rl = tgt.closest('[data-relink]'); if (rl) { openRelink(rl.dataset.relink); return; }
  const lk = tgt.closest('[data-link]'); if (lk) { const k = lk.dataset.link; if (k === 'make') openLinkMake(); else if (k === 'enter') openLinkEnter(); else if (k === 'leave') linkLeave(lk); return; }
  const bc = tgt.closest('[data-bdcat]'); if (bc) { S.bd = Object.assign(S.bd || {}, { cat: bc.dataset.bdcat }); if (S.route !== 'board') location.hash = 'board'; else VIEWS.board.render($('#v-board')); return; }
  const bs = tgt.closest('[data-bdsort]'); if (bs) { S.bd = Object.assign(S.bd || {}, { sort: bs.dataset.bdsort }); VIEWS.board.render($('#v-board')); return; }
  const tmv = tgt.closest('[data-team]'); if (tmv) { openTeam(tmv.dataset.team); return; }
  const tj = tgt.closest('[data-tmjoin]'); if (tj) { tmJoin(tj.dataset.tmjoin); return; }
  const tl = tgt.closest('[data-tmleave]'); if (tl) { if (!armed(tl, t('tm_leave_confirm'))) return; tmLeave(); return; }
  const te = tgt.closest('[data-tmedit]'); if (te) { openTeamEdit(te.dataset.tmedit === 'new'); return; }
  const tok = tgt.closest('[data-tmok]'); if (tok) { tmApprove(tok.dataset.tmok); return; }
  const tno = tgt.closest('[data-tmno]'); if (tno) { tmBan(tno.dataset.tmno).then(rerender); return; }
  const mySea = tgt.closest('a[href="#sea"]'); if (mySea && S.viewUid) { S.viewUid = null; if (location.hash === '#sea') { e.preventDefault(); show('sea'); window.scrollTo({ top: 0 }); } return; }
  const fs = tgt.closest('[data-frsort]'); if (fs) { S.frSort = fs.dataset.frsort; rerender(); return; }
  const ff = tgt.closest('[data-feedf]'); if (ff) { S.feedF = ff.dataset.feedf; rerender(); return; }
  const frk = tgt.closest('[data-frrank]'); if (frk) { S.rk = Object.assign(S.rk || { period: 'month', cat: 'points', sp: featuredSpecies()[0] }, { scope: 'FR' }); return; }
  const to = tgt.closest('[data-tryon]'); if (to) { S.viewUid = null; S.preview = previewFor(to.dataset.tryon); S.seaTab = 'shop'; show('sea'); window.scrollTo({ top: 0 }); toast(t('fr_tryon_toast'), 'info'); return; }
  const sk = tgt.closest('[data-shopkind]'); if (sk) { S.shopKind = sk.dataset.shopkind; rerender(); return; }
  const st = tgt.closest('[data-seatab]'); if (st) { S.seaTab = st.dataset.seatab; rerender(); return; }
  const pv = tgt.closest('[data-preview]'); if (pv) { S.preview = previewFor(pv.dataset.preview); if (S.preview.flair) toast(t('preview_flair'), 'info'); rerender(); const sw = $('.scene-wrap'); if (sw) sw.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  const by = tgt.closest('[data-buy]'); if (by) { buyItem(by.dataset.buy); return; }
  const tg = tgt.closest('[data-toggle]'); if (tg) { toggleItem(tg.dataset.toggle); return; }
  const df = tgt.closest('[data-dxf]'); if (df) { S.dx.f = df.dataset.dxf; rerender(); return; }
  const ts = tgt.closest('[data-tksp]'); if (ts) { S.tk.sp = ts.dataset.tksp; rerender(); return; }
  const tt = tgt.closest('[data-tktime]'); if (tt) { S.tk.time = tt.dataset.tktime; rerender(); return; }
  const tw = tgt.closest('[data-tkwater]'); if (tw) { S.tk.water = tw.dataset.tkwater; rerender(); return; }
  const cq = tgt.closest('[data-coachq]'); if (cq) { const sp2 = SPI[S.tk.sp] || SPI[inSeasonTop(homeRegion(), new Date().getMonth(), 1)[0].id]; VIEWS.tackle.ask(cq.dataset.coachq, sp2); return; }
  const th = tgt.closest('[data-themeset]'); if (th) { setTheme(th.dataset.themeset); rerender(); return; }
  const un = tgt.closest('[data-unit]'); if (un) { S.unit = un.dataset.unit; lsSet('unit', S.unit); rerender(); return; }
  const gr = tgt.closest('[data-grant]'); if (gr) { const [uid, oid, v] = gr.dataset.grant.split('|'); const g = Object.assign({}, S.admin.grants); g[uid] = Object.assign({}, g[uid] || {}, { [oid]: v }); store.saveAdmin('grants', g).then(() => rerender()); return; }
  const vd = tgt.closest('[data-verdict]'); if (vd) { const [uid, cid, v] = vd.dataset.verdict.split('|'); const g = Object.assign({}, S.admin.verdicts); g[uid] = Object.assign({}, g[uid] || {}, { [cid]: v }); store.saveAdmin('verdicts', g).then(() => { S.dataVer++; rerender(); }); return; }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'lang-sel' || id === 'lang-sel-m') { setLang(e.target.value); rerender(); }
  else if (id === 'rk-period') { S.rk.period = e.target.value; rerender(); }
  else if (id === 'rk-sp') { S.rk.sp = e.target.value; rerender(); }
});
document.addEventListener('paste', e => {
  if (viewOf(S.route) !== 'scan' || !S.scan || S.scan.phase !== 'idle') return;
  const f = [...(e.clipboardData?.files || [])].find(x => /^image\//.test(x.type)); if (f) startScan(f);
});
window.addEventListener('hashchange', onHash);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (S.route === 'sea' && S.scene) S.scene.frame(0, true); });

(function boot() {
  const saved = lsGet('lang', null);
  const nav = (navigator.language || 'ko').slice(0, 2);
  setLang(saved || (['ko', 'en', 'ja', 'zh'].includes(nav) ? nav : 'en'));
  setTheme(lsGet('theme', 'system'));
  S.unit = lsGet('unit', 'cm');
  S.me = lsGet('me', null);
  onHash();
  store.init().then(() => { updateStatic(); updateShell(); if (S.route === 'admin' && !S.isOwner) location.hash = 'home'; setTimeout(maybeWhatsNew, 2500); setTimeout(maybeWelcome, 1800); });
  const idle = window.requestIdleCallback || (f => setTimeout(f, 1200));
  idle(() => { GEO.loadEnv(); });
})();

</script>
